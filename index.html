<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Athen Adventure · V7</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#16242b;--paper:rgba(255,253,248,.94);--gold:#d5a34b;--sand:#f3ede1;--muted:#69737a;--ok:#e8f5e8;--bad:#fae7e4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#17252b}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-image:var(--bg);background-size:cover;background-position:center;filter:saturate(.75) brightness(.65);transform:scale(1.04);transition:background-image .8s ease,opacity .5s ease}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(9,18,24,.18),rgba(9,18,24,.62) 75%,rgba(9,18,24,.78))}
main{max-width:760px;margin:auto;padding:12px 15px 40px}
.top{position:sticky;top:0;z-index:20;padding:8px 0 12px;color:white}
.toprow{display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;letter-spacing:.03em}
.counter{font-size:.82rem;font-weight:700;background:rgba(255,255,255,.16);padding:7px 10px;border-radius:999px}
.progress{height:5px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;margin-top:9px}
.progress>i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
.card{background:var(--paper);border:1px solid rgba(255,255,255,.45);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.28);overflow:hidden;margin-top:8px}
.hero{padding:26px 20px;text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:800;color:#8a641f}
h1{font-size:clamp(1.65rem,7vw,2.35rem);line-height:1.06;margin:.35rem 0 .7rem}
h2{font-size:1.25rem;margin:.35rem 0 .75rem}
p{line-height:1.55}
.muted{color:var(--muted)}
.stationHead{padding:22px 20px 8px}
.question{padding:14px 20px 4px}
.qtext{font-weight:800;line-height:1.35;margin-bottom:10px}
.option{display:block;padding:12px 13px;margin:8px 0;border:1px solid #d9d4ca;border-radius:14px;background:#fffdf9;cursor:pointer}
.option input{margin-right:8px;transform:scale(1.12)}
button{border:0;border-radius:15px;padding:13px 16px;font-weight:800;font-size:1rem;cursor:pointer}
.primary{background:#172b34;color:white;width:100%}
.secondary{background:#ece6db;color:#27343a}
.controls{padding:18px 20px 22px}
.feedback{margin-top:12px;padding:12px 14px;border-radius:14px;font-weight:700}
.good{background:var(--ok)}
.bad{background:var(--bad)}
.reward{padding:0 20px 22px}
.rewardBox{background:linear-gradient(135deg,#fff9e8,#f5ead0);border:1px solid #e3c98d;border-radius:20px;padding:18px}
.rewardBox h2{margin-top:0}
.nextPhoto{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin:12px 0 14px;background:#ddd}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.actions button{width:100%}
.audio{display:flex;gap:9px;align-items:center;margin-top:10px}
.audio button{flex:1}
.mapWrap{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #ddd}
#map{height:280px}
.credit{font-size:.72rem;color:#6d7478;margin-top:7px}
.final{padding:28px 20px 30px;text-align:center}
.trophy{font-size:3.2rem}
.start{min-height:72vh;display:flex;align-items:center}
.startCard{min-height:72vh;display:flex;align-items:center;justify-content:center}
.startInner{padding:30px 22px 34px;text-align:center;width:100%}
.startIcon{font-size:4rem;margin-bottom:8px}
.startInner h1{margin-bottom:.5rem}
.startRules{text-align:left;background:#f5efe3;border-radius:18px;padding:16px 18px;margin:20px 0}
.startRules li{margin:8px 0;line-height:1.4}
.passwordWrap{margin-top:18px}
.passwordWrap input{width:100%;padding:14px 15px;border:1px solid #d9d4ca;border-radius:14px;font-size:1rem;background:#fffdf9;outline:none}
.passwordWrap input:focus{border-color:#b88732;box-shadow:0 0 0 3px rgba(184,135,50,.14)}
.passwordError{margin-top:9px;color:#9d3329;font-weight:700;min-height:1.2em}

.small{font-size:.9rem}
@media(max-width:500px){.actions{grid-template-columns:1fr}}
.infoPanel{margin-top:12px;padding:18px;border-radius:18px;background:#f5efe3}.infoPanel p{line-height:1.55}.infoPanel h3{margin:.25rem 0 .7rem}</style>
</head>

<script>
const stations=[{"n": 1, "title": "Syntagma-Platz", "place": "Syntagma-Platz", "questions": [{"text": "Welche Farbe dominiert an der großen Fassade des Parlaments?", "options": [{"key": "A", "text": "Weiß/hell"}, {"key": "B", "text": "Dunkelgrau"}, {"key": "C", "text": "Rot"}]}, {"text": "Was steht im Mittelpunkt der großen Fläche vor dem Parlament?", "options": [{"key": "A", "text": "Ein Brunnen"}, {"key": "B", "text": "Das Grabmal mit Relief"}, {"key": "C", "text": "Eine große Statue"}]}, {"text": "Die Wachen vor dem Grabmal tragen auffällige Schuhe. Was hängt an den Schuhspitzen?", "options": [{"key": "A", "text": "Runde Knöpfe"}, {"key": "B", "text": "Große Quasten/Pompons"}, {"key": "C", "text": "Sandalen"}]}], "code": "ABB", "next": "Nationalgarten", "audio": "Du hast den Syntagma-Platz geknackt. Der Platz ist nicht nur ein Verkehrsknotenpunkt, sondern ein Symbol der griechischen Demokratie. Sein Name bedeutet Verfassung. 1843 versammelten sich hier Bürger und Soldaten und forderten von König Otto eine Verfassung. Heute steht gegenüber das griechische Parlament. Besonders berühmt sind die Evzonen vor dem Grabmal des unbekannten Soldaten – die Männer in ihrer traditionellen Uniform mit den auffälligen Schuhen und Quasten. Wenn du ihnen beim Wachwechsel zusiehst, wirkt die Zeremonie fast wie ein Schauspiel. Und jetzt geht dein Abenteuer weiter in eine völlig andere Welt: nur wenige Schritte entfernt beginnt eine der grünsten Ecken Athens.", "lat": 37.9755, "lon": 23.7348, "image": "Syntagma_square_in_Athens.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Syntagma_square_in_Athens.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Syntagma", "info": "Du stehst jetzt am Syntagma-Platz. Der Name bedeutet auf Griechisch „Verfassung“. Der Platz entstand in den 1830er Jahren, als Athen zur Hauptstadt des neu gegründeten griechischen Staates ausgebaut wurde. Das Gebäude gegenüber dir war ursprünglich der Königspalast und ist heute der Sitz des griechischen Parlaments.\n\n1843 kam es hier zu einem entscheidenden Moment der griechischen Geschichte. Bürger und Soldaten versammelten sich und forderten von König Otto eine Verfassung. Der König musste nachgeben. Seitdem erinnert der Name Syntagma an diesen politischen Wendepunkt.\n\nHeute ist der Platz vor allem geschäftig: U-Bahn, Busse, Taxis, Touristen und Athener auf dem Weg zur Arbeit. Gleichzeitig ist Syntagma ein Treffpunkt für Demonstrationen, Feiern und politische Ereignisse.\n\nSchau dich einmal um. Für viele Athener ist dieser Platz tatsächlich das Zentrum der Stadt. Und genau hier beginnt deine Reise durch Athen."}, {"n": 2, "title": "Nationalgarten – Das Mosaik", "place": "Nationalgarten", "questions": [{"text": "Welche Grundform fällt im alten Mosaik besonders häufig auf?", "options": [{"key": "A", "text": "Kreise/Bögen"}, {"key": "B", "text": "Dreiecke"}, {"key": "C", "text": "Sterne"}]}, {"text": "Was erkennst du zwischen den geometrischen Formen?", "options": [{"key": "A", "text": "Pflanzen/Blätter"}, {"key": "B", "text": "Tiere"}, {"key": "C", "text": "Gesichter"}]}, {"text": "Welche Umgebung passt am besten zum Fundort?", "options": [{"key": "A", "text": "Offene Kreuzung"}, {"key": "B", "text": "Grüner Garten"}, {"key": "C", "text": "Sandplatz"}]}], "code": "AAB", "next": "Zappeion", "audio": "Willkommen im Nationalgarten. Was heute wie eine grüne Ruheinsel mitten in der Großstadt wirkt, war ursprünglich der königliche Garten. Königin Amalia ließ ihn ab 1838 anlegen. Sie soll sich persönlich um Pflanzen gekümmert haben; besonders bekannt sind die Palmen an einem der Eingänge. Der Garten ist riesig und beherbergt hunderte Pflanzenarten. Dein kleines Mosaik ist noch älter als der moderne Garten: Es stammt von einer römischen Villa und zeigt geometrische Pflanzen- und Blattmotive. Stell dir vor, wie dieser Ort vor fast zweitausend Jahren ausgesehen haben könnte – bevor Athen zu der modernen Metropole wurde, die du heute um dich herum siehst.", "lat": 37.9742, "lon": 23.7353, "image": "The_national_garden_of_Athens.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:The_national_garden_of_Athens.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:National_Garden_of_Athens", "info": "Der Ort, an dem du gerade stehst, war einmal ein königlicher Garten. Königin Amalia ließ ihn ab 1838 anlegen; um 1840 war die Anlage weitgehend fertig. Damals war der Garten Teil des königlichen Bereichs und nicht einfach ein öffentlicher Park.\n\nHeute ist der Nationalgarten eine grüne Oase mitten im Zentrum Athens. Er umfasst rund 158.000 Quadratmeter und beherbergt Pflanzen aus vielen Teilen der Welt. Es gibt schattige Wege, Teiche, Tiere, kleine versteckte Ecken und sogar archäologische Spuren.\n\nEine schöne Geschichte verbindet den Garten mit Königin Amalia selbst: Sie soll 1842 die großen Palmen an der Amalias Avenue eigenhändig gepflanzt haben.\n\nWenn du durch den Garten gehst, lohnt es sich deshalb, nicht nur nach großen Sehenswürdigkeiten zu suchen. Gerade die kleinen Details machen den Ort besonders. Der Nationalgarten ist eine Mischung aus königlicher Geschichte, Natur und antiken Spuren – und liegt trotzdem mitten im modernen Athen."}, {"n": 3, "title": "Zappeion – Der Eingang", "place": "Zappeion", "questions": [{"text": "Wie wirken die Säulen vor dem Eingang?", "options": [{"key": "A", "text": "Glatt und rund"}, {"key": "B", "text": "Stark geriffelt"}, {"key": "C", "text": "Gezackt"}]}, {"text": "Was befindet sich oben über den Säulen?", "options": [{"key": "A", "text": "Ein Dreieck/Giebel"}, {"key": "B", "text": "Ein runder Turm"}, {"key": "C", "text": "Eine Glaswand"}]}, {"text": "Welche Jahreszahl gehört zur Fertigstellung des Zappeion?", "options": [{"key": "A", "text": "1888"}, {"key": "B", "text": "1927"}, {"key": "C", "text": "1896"}]}], "code": "ABA", "next": "Panathenäisches Stadion", "audio": "Das Zappeion ist eines der großen neoklassizistischen Gebäude Athens. Es entstand im 19. Jahrhundert und war eng mit der Wiederbelebung der Olympischen Spiele verbunden. Der Bau wurde mit dem Vermögen der Brüder Evangelos und Konstantinos Zappas ermöglicht – daher der Name. Heute finden hier Ausstellungen, Veranstaltungen und offizielle Empfänge statt. Besonders schön ist der große Säulengang: Er wirkt wie ein klassisches antikes Gebäude, ist aber tatsächlich ein Produkt des modernen Griechenlands. Gleich daneben beginnt ein weiterer wichtiger Ort der olympischen Geschichte Athens – das komplett aus Marmor errichtete Panathenäische Stadion.", "lat": 37.9719, "lon": 23.7356, "image": "Zappeion_main_building_facade_Athens,_Greece.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Zappeion_main_building_facade_Athens,_Greece.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Zappeion", "info": "Das Gebäude vor dir heißt Zappeion. Es wurde nach Evangelos Zappas benannt, einem griechischen Förderer, der im 19. Jahrhundert die Wiederbelebung der Olympischen Spiele unterstützte.\n\nDas Zappeion wurde 1888 fertiggestellt und war eng mit dieser frühen olympischen Bewegung verbunden. Bei den ersten modernen Olympischen Spielen 1896 fanden hier die Fechtwettbewerbe statt.\n\nDamit steht das Gebäude für eine ungewöhnliche Idee: Man wollte eine Tradition, die aus der Antike stammte, in der modernen Welt wiederbeleben.\n\nWenn du das Zappeion heute siehst, wirkt es vielleicht wie ein eleganter neoklassischer Veranstaltungsort. Aber vor mehr als hundert Jahren war dieser Ort Teil eines großen Experiments. Würde die Idee der Olympischen Spiele wieder funktionieren?\n\nHeute wissen wir die Antwort. Die Spiele sind zu einem der größten internationalen Sportereignisse geworden.\n\nSchau dich ruhig noch einmal um. Das Zappeion ist damit nicht nur ein schönes Gebäude, sondern ein Stück Vorgeschichte der modernen Olympischen Spiele."}, {"n": 4, "title": "Panathenäisches Stadion", "place": "Panathenäisches Stadion", "questions": [{"text": "Welche Farbe hat das Stadion fast vollständig?", "options": [{"key": "A", "text": "Weiß/hell"}, {"key": "B", "text": "Rot"}, {"key": "C", "text": "Schwarz"}]}, {"text": "Welche Form beschreibt die Laufbahn am besten?", "options": [{"key": "A", "text": "Kreis"}, {"key": "B", "text": "Längliches U/Oval"}, {"key": "C", "text": "Dreieck"}]}, {"text": "Die große Statue vor dem Eingang steht…", "options": [{"key": "A", "text": "auf einem hohen Sockel"}, {"key": "B", "text": "direkt auf dem Boden"}, {"key": "C", "text": "auf einem Pferd"}]}], "code": "ABA", "next": "Hadriansbogen", "audio": "Das Panathenäische Stadion, auf Griechisch Kallimarmaro – das schöne Marmorstadion –, ist eines der ungewöhnlichsten Stadien der Welt. Schon in der Antike fanden hier Wettkämpfe statt. Jahrhunderte später wurde es für die ersten modernen Olympischen Spiele von 1896 wiederhergestellt. Das Stadion ist vollständig mit hellem Marmor verkleidet. Wenn du vor den Rängen stehst, kannst du dir leicht vorstellen, wie gewaltig die Wirkung bei einem großen Wettkampf gewesen sein muss. Das Stadion ist außerdem der traditionelle Zieleinlauf des Athen-Marathons. Deine nächste Spur führt nun zurück Richtung Zentrum – zu einem Monument, das zwei Epochen Athens miteinander verbindet.", "lat": 37.9697, "lon": 23.7402, "image": "Panathenaic_Stadium.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Panathenaic_Stadium.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Panathenaic_Stadium", "info": "Du stehst im Panathenäischen Stadion, auf Griechisch Kallimarmaro – „schöner Marmor“. Der Name passt: Das Stadion ist vollständig mit weißem Marmor verkleidet.\n\nAn diesem Ort fanden bereits in der Antike sportliche Wettbewerbe im Rahmen der Großen Panathenäen statt, eines Festes zu Ehren der Göttin Athena. Später wurde das Stadion unter Herodes Atticus umgebaut.\n\nViele Jahrhunderte geriet es in Vergessenheit. Erst im 19. Jahrhundert begann die Wiederherstellung. Für die ersten modernen Olympischen Spiele 1896 wurde das Stadion zum Schauplatz eines historischen Ereignisses.\n\nDabei gibt es ein interessantes Detail: 1896 war die Marmorausstattung noch nicht vollständig abgeschlossen. Viele Zuschauer saßen deshalb auf Holzbänken, die weiß gestrichen waren.\n\nHeute ist das Stadion eine der berühmtesten Sportstätten Athens. Und noch immer endet hier der Athen-Marathon.\n\nWenn du auf die Tribünen schaust, kannst du dir vorstellen, wie es hier 1896 gewesen sein muss: Athleten aus verschiedenen Ländern, tausende Zuschauer und eine Sporttradition, die gerade neu geboren wurde."}, {"n": 5, "title": "Hadriansbogen", "place": "Hadriansbogen", "questions": [{"text": "Wie viele große Durchgänge hat der Bogen unten?", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "3"}]}, {"text": "Welche Form dominiert den großen Durchgang?", "options": [{"key": "A", "text": "Rundbogen"}, {"key": "B", "text": "Dreieck"}, {"key": "C", "text": "Rechteck ohne Bogen"}]}, {"text": "Die große Inschrift am Bogen ist…", "options": [{"key": "A", "text": "auf Griechisch"}, {"key": "B", "text": "auf Latein"}, {"key": "C", "text": "nur aus Zahlen"}]}], "code": "ABA", "next": "Areopag", "audio": "Du stehst unter dem Hadriansbogen. Er wurde ungefähr im zweiten Jahrhundert nach Christus errichtet und war sinnbildlich ein Tor zwischen zwei Teilen Athens. Auf der einen Seite lag das ältere griechische Athen, auf der anderen die von den Römern geprägte Stadt. Der Bogen ist etwa 18 Meter hoch und besteht aus massivem Marmor. Besonders spannend: Er steht heute frei zwischen modernen Straßen und Häusern. Ein einzelnes antikes Bauwerk ist hier also zu einem Zeitfenster geworden. Wenn du durch den Bogen schaust, siehst du gleichzeitig eine moderne Großstadt und Spuren einer Stadt, die vor fast zweitausend Jahren ganz anders aussah.", "lat": 37.9702, "lon": 23.732, "image": "Hadrian%27s_arch.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Hadrian%27s_arch.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Hadrian%27s_Arch", "info": "Vor dir steht das Hadrianstor. Es wurde vermutlich zwischen 131 und 134 nach Christus errichtet und trägt den Namen des römischen Kaisers Hadrian.\n\nHadrian war ein großer Bewunderer der griechischen Kultur. Während seiner Herrschaft erhielt Athen zahlreiche neue Bauwerke und wurde im römischen Reich weiter ausgebaut.\n\nDas Tor markierte symbolisch den Übergang zwischen dem älteren, klassischen Athen und dem neueren römischen Stadtbereich. In der Nähe entstand unter Hadrian auch der monumentale Tempel des Olympischen Zeus.\n\nDas Spannende ist deshalb nicht nur die Größe des Tores. Es erzählt von einer Stadt, die sich über Jahrhunderte verändert hat.\n\nWenn du heute davorstehst, ist die Umgebung voller moderner Straßen und Gebäude. Aber genau hier verlief einst die Grenze zwischen verschiedenen Teilen der Stadt.\n\nDu kannst dir vorstellen, wie viele Menschen diesen Bereich in den vergangenen zweitausend Jahren passiert haben: Händler, Soldaten, Reisende, Bewohner – und heute natürlich Besucher auf einer Schnitzeljagd."}, {"n": 6, "title": "Areopag – Fels und Aussicht", "place": "Areopag", "questions": [{"text": "Worauf stehst du hier hauptsächlich?", "options": [{"key": "A", "text": "Holz"}, {"key": "B", "text": "Naturstein/Fels"}, {"key": "C", "text": "Metall"}]}, {"text": "Was ragt beim Blick Richtung Akropolis besonders deutlich über die Häuser hinaus?", "options": [{"key": "A", "text": "Die Akropolis"}, {"key": "B", "text": "Das Zappeion"}, {"key": "C", "text": "Das Stadion"}]}, {"text": "Der Zugang zum Fels besteht teilweise aus…", "options": [{"key": "A", "text": "Metalltreppen"}, {"key": "B", "text": "Holzstegen"}, {"key": "C", "text": "Stein-/Metallstufen"}]}], "code": "ABC", "next": "Philopappos-Hügel", "audio": "Der Areopag ist kein gewöhnlicher Aussichtspunkt. Dieser felsige Hügel war bereits in der Antike ein bedeutender Ort für Recht und Politik. Der Name bedeutet ungefähr Hügel des Ares. Hier tagte der Areopag, ein sehr altes Gremium Athens. Auch in der christlichen Überlieferung spielt der Ort eine Rolle: Der Apostel Paulus soll hier zu den Athenern gesprochen haben. Heute ist der Fels vor allem wegen seiner Aussicht beliebt. Direkt gegenüber liegt die Akropolis. Von hier aus wird deutlich, wie eng die historischen Hügel Athens miteinander verbunden sind. Dein nächstes Ziel liegt ebenfalls auf einem dieser Hügel.", "lat": 37.972, "lon": 23.7239, "image": "View_of_Athens_from_the_Areopagus.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:View_of_Athens_from_the_Areopagus.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Areopagus", "info": "Dieser Felsen heißt Areopag, ungefähr „Felsen des Ares“. In der Antike war der Areopag einer der wichtigsten Orte des politischen und rechtlichen Lebens Athens.\n\nHier tagte ein bedeutendes Gericht, das sich unter anderem mit schweren Fällen beschäftigte. Der Felsen war also gewissermaßen ein Gerichtssaal unter freiem Himmel.\n\nAuch die Mythologie erzählt eine Geschichte über diesen Ort. Nach einer Überlieferung wurde Ares hier vor den Göttern angeklagt. Mythos und Geschichte liegen in Athen oft erstaunlich dicht nebeneinander.\n\nHeute ist der Areopag vor allem für seinen Blick auf die Akropolis bekannt. Wenn du dich umdrehst, bekommst du ein Gefühl dafür, wie eng die wichtigsten Orte des antiken Athens beieinanderliegen.\n\nDas macht den Areopag so interessant: Du stehst auf einem Felsen, der gleichzeitig mit Mythologie, Recht, Politik und dem Alltag der antiken Stadt verbunden ist.\n\nNimm dir ruhig einen Moment für die Aussicht, bevor du weiterziehst."}, {"n": 7, "title": "Philopappos-Denkmal", "place": "Philopappos-Hügel", "questions": [{"text": "Wie viele deutlich erkennbare menschliche Figuren siehst du im zentralen Reliefbereich?", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "3 oder mehr"}]}, {"text": "Welche Farbe hat das Monument überwiegend?", "options": [{"key": "A", "text": "Weiß/heller Marmor"}, {"key": "B", "text": "Rot"}, {"key": "C", "text": "Schwarz"}]}, {"text": "Was siehst du direkt hinter bzw. unterhalb des Monuments besonders deutlich?", "options": [{"key": "A", "text": "Weite Aussicht über die Stadt"}, {"key": "B", "text": "Großen See"}, {"key": "C", "text": "U-Bahn-Station"}]}], "code": "AAB", "next": "Agia Marina", "audio": "Du bist auf dem Philopappos-Hügel angekommen, einem der schönsten Aussichtspunkte Athens. Das monumentale Grabmal auf dem Gipfel wurde im zweiten Jahrhundert errichtet und erinnert an Gaius Julius Antiochus Epiphanes Philopappos, einen hochrangigen Mann aus dem Königreich Kommagene. Deshalb heißt der Hügel heute Philopappos-Hügel. Früher wurde er auch Hügel der Musen genannt. Der vielleicht wichtigste Schatz hier ist allerdings gar nicht das Monument: Es ist die Aussicht. Vor dir liegt die Akropolis, dahinter breitet sich Athen bis zum Meer aus. Dein nächstes Ziel führt dich nun auf den benachbarten Hügel der Nymphen.", "lat": 37.9711, "lon": 23.7251, "image": "The_Monument_of_Philopappos_in_Athens.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:The_Monument_of_Philopappos_in_Athens.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Philopappos_Monument", "info": "Du befindest dich auf dem Philopappos-Hügel, auch Musenhügel genannt. In der Antike gab es hier ein Heiligtum, das mit dem Dichter und Propheten Musaios verbunden wurde.\n\nDas bekannteste Bauwerk auf dem Hügel ist das Monument für Philopappos. Philopappos war ein römischer Konsul und stammte aus dem Königreich Kommagene. Das Monument zu seinen Ehren wurde im zweiten Jahrhundert errichtet.\n\nVon hier oben ist aber etwas anderes mindestens genauso beeindruckend: der Blick über Athen. Besonders die Akropolis liegt eindrucksvoll vor dir. Bei guter Sicht reicht der Blick weit über die Stadt bis zum Meer.\n\nDer Hügel ist außerdem ein Ort, den die Athener selbst gerne nutzen. Am „Reinen Montag“, dem ersten Tag der orthodoxen Fastenzeit, kommen viele Familien hierher zum Picknick und lassen Drachen steigen.\n\nDas ist typisch für Athen: Antike Monumente und ganz normales modernes Stadtleben liegen direkt nebeneinander.\n\nSchau dich deshalb nicht nur nach Ruinen um. Schau auch auf die Stadt, die heute um dich herum lebt."}, {"n": 8, "title": "Agia Marina – Die Kirche mit dem Felsen", "place": "Agia Marina / Hügel der Nymphen", "questions": [{"text": "Was ist am älteren Teil besonders auffällig?", "options": [{"key": "A", "text": "In den Fels gehauen"}, {"key": "B", "text": "Komplett aus Glas"}, {"key": "C", "text": "Auf Stelzen"}]}, {"text": "Welche Farbe dominiert an der großen Kirche?", "options": [{"key": "A", "text": "Weiß/hell"}, {"key": "B", "text": "Blau"}, {"key": "C", "text": "Schwarz"}]}, {"text": "Der ältere Teil wirkt eher wie…", "options": [{"key": "A", "text": "Kleine Felskammer/Kapelle"}, {"key": "B", "text": "Hoher Turm"}, {"key": "C", "text": "Freistehender Tempel"}]}], "code": "AAA", "next": "Kerameikos", "audio": "Agia Marina ist ein besonderer Ort, weil hier eine moderne Kirche mit einem viel älteren, in den Fels gehauenen Bereich verbunden ist. Die kleine Felskapelle gehört zu den ungewöhnlichsten sakralen Orten der westlichen Akropolis-Hügel. Gleich oberhalb liegt das Nationale Observatorium auf dem Hügel der Nymphen. Das Observatorium wurde im 19. Jahrhundert gegründet und war für die junge griechische Nation ein Symbol des wissenschaftlichen Aufbruchs. 1902 wurde dort Griechenlands erstes Teleskop installiert. Heute kannst du hier also in wenigen Minuten zwischen Felsenkapelle, Kirche, Aussicht und Astronomiegeschichte wechseln. Deine nächste Station führt dich wieder hinunter in die antike Stadt.", "lat": 37.973702, "lon": 23.718991, "image": "Church_of_Agia_Marina,_Dome_of_Athens_Observatory,_Hill_of_the_Nymphs-2.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Church_of_Agia_Marina,_Dome_of_Athens_Observatory,_Hill_of_the_Nymphs-2.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Church_of_Agia_Marina_(Athens)", "info": "Vor dir liegt die Kirche Agia Marina. Die heutige Kirche stammt aus dem frühen 20. Jahrhundert und wurde in den 1920er Jahren errichtet.\n\nDie Geschichte dieses Ortes reicht jedoch viel weiter zurück. Besonders spannend ist der in den Fels gehauene Bereich bei der Kirche. Der Platz wurde bereits in vorchristlicher Zeit für religiöse Zwecke genutzt und später Teil der christlichen Geschichte.\n\nDamit stehen hier verschiedene Zeitschichten übereinander: eine ältere Kultstätte, christliche Tradition und die moderne Stadtgeschichte Athens.\n\nDie heutige Kirche ist der Heiligen Marina gewidmet. Wenn du dich umsiehst, achte deshalb nicht nur auf das Gebäude. Interessant ist gerade die Verbindung zwischen Fels, Höhle und Kirche.\n\nAthen ist voller solcher Orte. Nicht jede wichtige historische Stelle besteht aus einem riesigen Tempel. Manchmal entdeckt man Geschichte an einem kleinen, etwas versteckten Ort.\n\nGenau deshalb passt Agia Marina so gut zu deiner Schnitzeljagd: Man muss hinschauen, um sie wirklich zu entdecken."}, {"n": 9, "title": "Kerameikos", "place": "Kerameikos", "questions": [{"text": "Was ist hier besonders typisch?", "options": [{"key": "A", "text": "Grabmonumente"}, {"key": "B", "text": "Moderne Hochhäuser"}, {"key": "C", "text": "Palmenallee"}]}, {"text": "Viele sichtbare antike Steinobjekte sind…", "options": [{"key": "A", "text": "Hochkantige Grabstelen/Monumente"}, {"key": "B", "text": "Nur runde Säulen"}, {"key": "C", "text": "Nur Bögen"}]}, {"text": "Welche Landschaft passt am besten?", "options": [{"key": "A", "text": "Archäologische Ruinen in offener Fläche"}, {"key": "B", "text": "Einkaufszentrum"}, {"key": "C", "text": "Strand"}]}], "code": "AAA", "next": "Monastiraki", "audio": "Kerameikos erzählt eine andere Geschichte als die Akropolis. Der Name kommt von den Töpfern, die in dieser Gegend arbeiteten. Gleichzeitig lag hier eine der wichtigsten Nekropolen des antiken Athens. Viele der sichtbaren Grabmonumente standen einst entlang der Straßen und erinnerten an die Verstorbenen. Besonders faszinierend ist, dass sich hier Stadtgeschichte und Alltagsleben mischen: Werkstätten, Straßen, Mauern und Gräber lagen dicht beieinander. Wenn du dich umsiehst, erkennst du deshalb nicht nur einzelne Ruinen, sondern den Grundriss eines ganzen antiken Stadtviertels. Jetzt geht es wieder mitten hinein ins moderne Athen.", "lat": 37.9781, "lon": 23.7181, "image": "Kerameikos.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Kerameikos.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Kerameikos", "info": "Du befindest dich im Kerameikos. Der Name geht auf die Töpfer und Keramiker zurück, die in diesem Gebiet arbeiteten.\n\nHeute ist Kerameikos vor allem für seinen antiken Friedhof bekannt. Über viele Jahrhunderte wurden hier Menschen bestattet. Entlang wichtiger Straßen standen Grabmonumente und Erinnerungssteine.\n\nKerameikos war aber nicht einfach nur ein Friedhof. Hier verliefen auch wichtige Wege aus der Stadt hinaus. Durch die großen Stadttore verließen Reisende Athen in Richtung Außenwelt.\n\nIn der Nähe lag außerdem der öffentliche Friedhof, auf dem bedeutende Bürger und im Krieg gefallene Athener bestattet wurden. Mit diesem Ort wird auch die berühmte Grabrede des Perikles für die Gefallenen des Peloponnesischen Krieges verbunden.\n\nWenn du dich heute zwischen den Ruinen bewegst, stell dir deshalb nicht nur einen Friedhof vor. Stell dir eine belebte Verkehrsachse vor: Händler, Reisende, Familien und Menschen auf dem Weg aus der Stadt.\n\nKerameikos war ein Übergangsort – zwischen Stadt und Außenwelt und zwischen Leben und Tod."}, {"n": 10, "title": "Monastiraki – Drei Wahrzeichen", "place": "Monastiraki", "questions": [{"text": "Welche kleine Kuppelkirche steht am Platz?", "options": [{"key": "A", "text": "Pantanassa"}, {"key": "B", "text": "Agia Marina"}, {"key": "C", "text": "St. Paul"}]}, {"text": "Was befindet sich direkt bei der Metro?", "options": [{"key": "A", "text": "Bahnhof/Metrozugang"}, {"key": "B", "text": "Stadion"}, {"key": "C", "text": "Museumsturm"}]}, {"text": "Was liegt oberhalb der Stadt und ist vom Platz gut sichtbar?", "options": [{"key": "A", "text": "Akropolis"}, {"key": "B", "text": "Nationalgarten"}, {"key": "C", "text": "Panathenäisches Stadion"}]}], "code": "AAA", "next": "Psyrri", "audio": "Monastiraki ist einer der lebendigsten Plätze Athens. Hier treffen mehrere Zeiten aufeinander: die kleine Kirche Pantanassa, der moderne Metroverkehr, Geschäfte, Märkte und darüber die Akropolis. Der Name Monastiraki bedeutet kleines Kloster und erinnert an ein früheres Kloster, das hier stand. Rund um den Platz findest du heute Flohmärkte, Souvenirläden, Cafés und sehr viel Straßenleben. Genau diese Mischung macht den Ort so typisch für Athen: Antike und byzantinische Spuren stehen unmittelbar neben moderner Großstadt. Deine letzte Rätselstation liegt nur wenige Minuten entfernt in Psyrri.", "lat": 37.9765, "lon": 23.7257, "image": "Monastiraki-athens.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Monastiraki-athens.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Monastiraki", "info": "Willkommen in Monastiraki. Der Name bedeutet „kleines Kloster“ und geht auf ein ehemaliges Kloster zurück. Von diesem Komplex ist vor allem die kleine Kirche Pantanassa erhalten.\n\nWenn du dich heute umsiehst, bekommst du einen perfekten Eindruck davon, wie viele Zeitschichten in Athen nebeneinander existieren: eine byzantinische Kirche, eine Moschee, antike Ruinen, moderne Geschäfte und ein berühmter Flohmarkt.\n\nBesonders bekannt ist die Ifestou-Straße. Dort findest du Second-Hand-Waren, Lederprodukte, Souvenirs, Werkzeug und alle möglichen Kuriositäten.\n\nMonastiraki war schon lange ein Ort des Handels und Handwerks. Heute treffen hier Einheimische, Händler und Touristen aufeinander.\n\nSchau vom Platz einmal in Richtung Akropolis. Genau dort zeigt sich die Besonderheit Athens besonders deutlich: verschiedene Epochen stehen direkt nebeneinander.\n\nDie Vergangenheit ist hier nicht in einem Museum eingeschlossen. Sie ist Teil des normalen Stadtlebens."}, {"n": 11, "title": "Psyrri – Das Finale", "place": "Psyrri / Iroon-Platz", "questions": [{"text": "Was steht auf dem Iroon-Platz auffällig in der Mitte?", "options": [{"key": "A", "text": "Kleiner Brunnen"}, {"key": "B", "text": "Pferdestatue"}, {"key": "C", "text": "Großer Obelisk"}]}, {"text": "Wie viele schmale Straßen führen ungefähr vom Platz weg?", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "5"}, {"key": "C", "text": "10"}]}, {"text": "Welche Umgebung beschreibt Psyrri besser?", "options": [{"key": "A", "text": "Enge Gassen mit Cafés, Bars und Street Art"}, {"key": "B", "text": "Autobahn"}, {"key": "C", "text": "Reines Museumsviertel"}]}], "code": "ABA", "next": "FINALE", "audio": "Geschafft! Psyrri ist heute eines der lebendigsten Viertel im Zentrum Athens. Die engen Gassen, kleinen Plätze, Cafés, Bars und Street-Art-Werke geben dem Viertel einen ganz anderen Charakter als die großen antiken Monumente. Historisch war Psyrri allerdings lange ein Arbeiterviertel und galt zeitweise als eher raues Viertel. In den letzten Jahrzehnten wandelte es sich stark. Heute sitzen Besucher und Athener in denselben kleinen Straßen, in denen früher Handwerker und Händler ihrem Alltag nachgingen. Und damit endet deine Reise durch Athen: Du hast die Stadt nicht nur angesehen, sondern dich von Ort zu Ort selbst durch sie hindurchgerätselt.", "lat": 37.9805, "lon": 23.7245, "image": "Psyrri,_Athens.jpg", "imagePage": "https://commons.wikimedia.org/wiki/File:Psyrri,_Athens.jpg", "imageSearch": "https://commons.wikimedia.org/wiki/Category:Psyri", "info": "Du bist jetzt in Psyrri. Heute findest du hier Bars, Restaurants, kleine Geschäfte, Street-Art und jede Menge Nachtleben.\n\nDas Viertel war allerdings lange Zeit vor allem ein traditionelles Handwerker- und Geschäftsviertel. Werkstätten und kleine Betriebe prägten die Straßen.\n\nIm Laufe der Zeit veränderte sich Psyrri stark. Alte Geschäfte verschwanden, neue Restaurants und Bars entstanden und das Viertel wurde zu einem beliebten Ausgehviertel.\n\nGleichzeitig sind viele Spuren der älteren Stadt erhalten geblieben. Wenn du durch die Straßen gehst, lohnt sich ein Blick auf die Fassaden und in die kleinen Gassen.\n\nAuch die Geschichte der jüdischen Gemeinde Athens ist hier sichtbar. In der Melidoni-Straße befinden sich zwei Synagogen.\n\nPsyrri ist deshalb ein passender Abschluss deiner Reise. Du hast während der Schnitzeljagd immer wieder erlebt, dass Athens Geschichte nicht irgendwo weit weg liegt.\n\nSie steckt in Plätzen, Felsen, Kirchen, Stadien, Märkten und ganz normalen Straßen.\n\nDu hast elf Stationen gesehen.\n\nJetzt kennst du Athen ein kleines bisschen besser.\n\nUnd vielleicht schaust du beim nächsten Spaziergang etwas genauer hin."}];
const ACCESS_PASSWORD="ATHEN2026";
let unlocked=localStorage.getItem("athenAdventureUnlocked")==="1";
let current=Number(localStorage.getItem("athenAdventureStation")||0);
let map=null, utterance=null;

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}
function save(){localStorage.setItem("athenAdventureStation",String(current));}
function imgUrl(s){return "https://commons.wikimedia.org/wiki/Special:FilePath/"+s.image;}
function mapsUrl(s){return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(s.lat+","+s.lon);}
function updateTop(){document.getElementById("counter").textContent=current<stations.length?`${current+1} / ${stations.length}`:"GESCHAFFT";document.getElementById("progress").style.width=(current/stations.length*100)+"%";}
function setBackground(){if(current<stations.length) document.body.style.setProperty("--bg",`url("${imgUrl(stations[current])}")`);}
function voices(){return window.speechSynthesis?window.speechSynthesis.getVoices():[];}
function stopAudio(){if(window.speechSynthesis) window.speechSynthesis.cancel();}
function speak(text){
  stopAudio();
  if(!("speechSynthesis" in window)){alert("Dein Browser unterstützt leider keine Sprachwiedergabe.");return;}
  const v=voices();
  const preferred=v.find(x=>/de(-|_)(DE|AT|CH)/i.test(x.lang)&&/female|anna|katja|hedda|petra|sophie|sara/i.test(x.name))
      ||v.find(x=>/^de/i.test(x.lang)&&/premium|enhanced|natural|online/i.test(x.name))
      ||v.find(x=>/^de/i.test(x.lang))||v[0];
  utterance=new SpeechSynthesisUtterance(text);
  if(preferred) utterance.voice=preferred;
  utterance.lang=preferred?.lang||"de-DE";
  utterance.rate=.91; utterance.pitch=.98; utterance.volume=1;
  window.speechSynthesis.speak(utterance);
}
function reset(){if(confirm("Den gesamten Spielfortschritt löschen?")){stopAudio();current=0;save();render();}}
function lockGame(){stopAudio();unlocked=false;localStorage.removeItem("athenAdventureUnlocked");render();}
function checkAnswers(){
  const s=stations[current], answers=[0,1,2].map(i=>document.querySelector(`input[name="q${i}"]:checked`)?.value||"");
  if(answers.length<3){showFeedback("Bitte beantworte alle drei Fragen.","bad");return;}
  const code=answers.join("");
  if(code!==s.code){showFeedback("Noch nicht. Prüfe deine Beobachtungen und versuche es erneut.","bad");return;}
  showReward(s);
}
function showFeedback(t,c){document.querySelector("#feedback").className="feedback "+c;document.querySelector("#feedback").textContent=t;}
function toggleInfo(){
  const panel=document.getElementById("infoPanel");
  const text=document.getElementById("infoText");
  if(!panel) return;
  const open=panel.style.display!=="none";
  if(open){panel.style.display="none";return;}
  text.textContent=stations[current].info||"Für diese Station ist noch kein Wissensguide hinterlegt.";
  panel.style.display="block";
}
function nextStation(){stopAudio();current++;save();render();window.scrollTo({top:0,behavior:"smooth"});}
function showReward(s){
  document.querySelector("#quiz").style.display="none";
  const next=current+1<stations.length?stations[current+1]:null;
  const box=document.querySelector("#reward");
  box.style.display="block";
  box.innerHTML=next?`
    <div class="rewardBox">
      <div class="eyebrow">Code geknackt</div>
      <h2>🎉 Dein nächstes Ziel</h2>
      <h1>${esc(next.place)}</h1>
      <img class="nextPhoto" src="${imgUrl(next)}" alt="${esc(next.place)}" onerror="this.style.display='none'">
      <div class="credit">Bild: Wikimedia Commons · <a href="${next.imagePage}" target="_blank" rel="noopener">Quelle ansehen</a></div>
      <div class="actions">
        <button class="secondary" onclick="openMap()">🗺️ Karte anzeigen</button>
        <button class="secondary" onclick="window.open(mapsUrl(stations[current+1]),'_blank')">🚶 Route starten</button>
      </div>
      <div id="mapPanel" class="mapWrap" style="display:none"><div id="map"></div><div class="small muted" style="margin-top:7px">🚶 Laufweg über OpenStreetMap · © OpenStreetMap contributors</div></div>
      <div class="audio">
        <button class="primary" onclick="speak(stations[current].audio)">🎧 Audioguide abspielen</button>
        <button class="secondary" onclick="stopAudio()">■</button>
      </div>
      <button class="secondary" style="width:100%;margin-top:10px" onclick="toggleInfo()">🏛️ Mehr über diesen Ort</button>
      <div id="infoPanel" class="infoPanel" style="display:none">
        <div class="eyebrow">Wissensguide</div>
        <h3>🏛️ Mehr über diesen Ort</h3>
        <p id="infoText"></p>
        <div class="audio">
          <button class="primary" onclick="speak(stations[current].info)">🎧 Information anhören</button>
          <button class="secondary" onclick="stopAudio()">■</button>
        </div>
      </div>
      <button class="primary" style="margin-top:12px" onclick="nextStation()">Weiter zur nächsten Station →</button>
    </div>`:
    `<div class="rewardBox"><div class="eyebrow">Finale</div><h2>🏆 Du hast Athen geknackt!</h2><p>${esc(s.audio)}</p><div class="audio"><button class="primary" onclick="speak(stations[current].audio)">🎧 Finale anhören</button><button class="secondary" onclick="stopAudio()">■</button></div></div>`;
  if(next) setTimeout(()=>speak(s.audio),250);
  window.scrollTo({top:document.querySelector("#reward").offsetTop-20,behavior:"smooth"});
}
async function openMap(){
  const next=stations[current+1];
  if(!next) return;
  const panel=document.getElementById("mapPanel");
  const mapEl=document.getElementById("map");
  if(!mapEl || !panel) return;
  panel.style.display="block";
  if(map){ map.remove(); map=null; }
  map=L.map("map",{scrollWheelZoom:true}).setView([next.lat,next.lon],16);
  setTimeout(()=>map.invalidateSize(),80);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors',
    referrerPolicy:"strict-origin-when-cross-origin"
  }).addTo(map);

  const from=stations[current], to=stations[current+1];
  const fromLL=[from.lat,from.lon], toLL=[to.lat,to.lon];

  L.marker(fromLL).addTo(map).bindPopup("<b>Du bist hier</b><br>"+esc(from.name));
  L.marker(toLL).addTo(map).bindPopup("<b>Nächstes Ziel</b><br>"+esc(to.name));

  const fallback=L.polyline([fromLL,toLL],{
    color:"#b88732",weight:4,dashArray:"8 8",opacity:.75
  }).addTo(map);

  try{
    const url="https://routing.openstreetmap.de/routed-foot/route/v1/driving/"
      +from.lon+","+from.lat+";"+to.lon+","+to.lat
      +"?overview=full&geometries=geojson&steps=true";
    const res=await fetch(url);
    if(!res.ok) throw new Error("Routing HTTP "+res.status);
    const data=await res.json();
    const coords=data?.routes?.[0]?.geometry?.coordinates;
    if(!coords?.length) throw new Error("Keine Route");
    const latlngs=coords.map(p=>[p[1],p[0]]);
    fallback.remove();
    L.polyline(latlngs,{color:"#b88732",weight:5,opacity:.95}).addTo(map);

    const km=(data.routes[0].distance/1000).toFixed(2);
    const min=Math.max(1,Math.round(data.routes[0].duration/60));
    L.popup({closeButton:false,autoClose:false,closeOnClick:false})
      .setLatLng(toLL)
      .setContent("<b>🚶 Laufweg</b><br>"+km+" km · ca. "+min+" Min.")
      .openOn(map);
    map.fitBounds(L.latLngBounds(latlngs).pad(.18));
  }catch(e){
    map.fitBounds(L.latLngBounds([fromLL,toLL]).pad(.35));
  }
}

function startAdventure(){
  const input=document.getElementById("accessPassword");
  const value=(input?.value||"").trim();
  const err=document.getElementById("passwordError");
  if(value!==ACCESS_PASSWORD){
    if(err) err.textContent="Das Passwort stimmt noch nicht.";
    if(input){input.value="";input.focus();}
    return;
  }
  unlocked=true;
  localStorage.setItem("athenAdventureUnlocked","1");
  render();
}
function renderIntro(){
  updateTop();
  document.body.style.setProperty("--bg",'linear-gradient(135deg,#17252b,#30454d)');
  document.getElementById("app").innerHTML=`<div class="card startCard">
    <div class="startInner">
      <div class="startIcon">🏛️</div>
      <div class="eyebrow">Eine Reise durch Athen</div>
      <h1>ATHEN ADVENTURE</h1>
      <p>Eine kleine Stadtrallye für scharfe Augen, gute Kombinationsgabe und ein bisschen Entdeckergeist.</p>
      <div class="startRules">
        <strong>So funktioniert's</strong>
        <ul>
          <li>Du besuchst 11 Stationen in Athen.</li>
          <li>An jedem Ort löst du 3 kleine Beobachtungsrätsel.</li>
          <li>Die drei Antworten ergeben einen Code.</li>
          <li>Erst mit dem richtigen Code wird das nächste Ziel enthüllt.</li>
        </ul>
      </div>
      <p class="small muted">Bereit für dein Abenteuer? Gib das Passwort ein.</p>
      <div class="passwordWrap">
        <input id="accessPassword" type="password" autocomplete="off" placeholder="Passwort" onkeydown="if(event.key==='Enter')startAdventure()">
        <div id="passwordError" class="passwordError"></div>
        <button class="primary" style="margin-top:10px" onclick="startAdventure()">🚀 Abenteuer starten</button>
      </div>
    </div>
  </div>`;
}
function render(){
  updateTop();
  const app=document.getElementById("app");
  if(!unlocked){renderIntro();return;}
  setBackground();
  if(current>=stations.length){
    app.innerHTML=`<div class="card final"><div class="trophy">🏆</div><div class="eyebrow">Mission abgeschlossen</div><h1>Athen geknackt!</h1><p class="muted">11 Stationen · 33 Rätsel · eine Stadtrunde.</p><button class="primary" onclick="reset()">↺ Nochmal spielen</button><button class="secondary" style="margin-top:10px;width:100%" onclick="lockGame()">🔒 Spiel sperren</button></div>`;
    return;
  }
  const s=stations[current];
  app.innerHTML=`<div class="card">
    <div class="stationHead"><div class="eyebrow">Station ${current+1} von ${stations.length}</div><h1>${esc(s.title)}</h1><p class="muted">Beobachte den Ort genau. Die drei Antworten ergeben deinen Code.</p></div>
    <div id="quiz">
      ${s.questions.map((q,i)=>`<div class="question"><div class="qtext">${i+1}. ${esc(q.text)}</div>${q.options.map(o=>`<label class="option"><input type="radio" name="q${i}" value="${o.key}"> <strong>${o.key}</strong> · ${esc(o.text)}</label>`).join("")}</div>`).join("")}
      <div class="controls"><button class="primary" onclick="checkAnswers()">Code prüfen</button><div id="feedback" class="feedback" style="display:block;background:transparent;color:#69737a">Noch kein Code geprüft.</div></div>
    </div>
    <div id="reward" class="reward" style="display:none"></div>
  </div>`;
}
render();
window.speechSynthesis?.getVoices();
window.speechSynthesis?.addEventListener("voiceschanged",()=>window.speechSynthesis.getVoices());
</script>
